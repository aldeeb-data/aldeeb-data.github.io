<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR كارت محمد الديب</title>
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#0B1220">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="كارت QR">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
html{color-scheme:only light}
.q,.q *{forced-color-adjust:none;-webkit-filter:none;filter:none}
html,body{margin:0;height:100%;background:#0B1220;color:#F5F2EA;font-family:Cairo,system-ui,sans-serif}
.w{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;box-sizing:border-box;text-align:center}
.q{position:relative;width:min(84vw,62vh,520px);aspect-ratio:1;background:#fff;border-radius:22px;padding:8px;box-sizing:border-box;box-shadow:0 0 0 3px #E8B64C}
.q .code{width:100%;height:100%;display:block;border-radius:12px}
h1{margin:0;font-size:26px;font-weight:900}
p{margin:0;color:#B8C2D6;font-size:17px}
.u{direction:ltr;color:#E8B64C;font-weight:800;font-size:18px;text-decoration:none}
</style>
</head>
<body>
<main class="w">
<h1>محمد الديب</h1>
<div class="q"><img class="code" src="qr-plain.png" alt="كود QR لكارت تعريف محمد الديب"></div>
<p>وجّه كاميرا موبايلك على الكود ده… هيفتح لك كارت محمد الديب</p>
<a class="u" href="https://aldeebdata.com/">aldeebdata.com</a>
</main>
<script>try{if(navigator.wakeLock)navigator.wakeLock.request('screen')}catch(e){}</script>
</body>
</html>
